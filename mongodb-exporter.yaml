apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: mongodb
  labels:
    app: prod-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-mongo
  template:
    metadata:
      labels:
        app: prod-mongo
    spec:
      containers:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.40.0
          args:
            - --collect-all
          ports:
            - name: metrics
              containerPort: 9216
          env:
            - name: MONGODB_URI
              value: "mongodb://clusterMonitor:WnryX4HqjL7VI36Oo@prod-mongo-rs0.mongodb.svc.cluster.local:27017/admin?replicaSet=rs0"