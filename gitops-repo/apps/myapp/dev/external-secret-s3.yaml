apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-secret
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager   # same one you're already using
    kind: ClusterSecretStore

  target:
    name: s3-secret
    creationPolicy: Owner

  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: mongo-s3-credentials
        property: AWS_ACCESS_KEY_ID

    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: mongo-s3-credentials
        property: AWS_SECRET_ACCESS_KEY