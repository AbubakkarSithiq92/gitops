apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbubakkarSithiq92/gitops.git
    targetRevision: master
    path: gitops-repo/charts/myapp
    helm:
      valueFiles:
        - ../../values/myapp/test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
