apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: prod-mongo
  namespace: mongodb
  labels:
    app: prod-mongo #important for monitoring to work

spec:
  crVersion: 1.16.0
  image: percona/percona-server-mongodb:7.0
  imagePullPolicy: IfNotPresent

  updateStrategy: SmartUpdate

  secrets:
    users: prod-mongo-users
    encryptionKey: prod-mongo-encryption

  pmm:
    enabled: false
    image: percona/pmm-client:2.41.0
    serverHost: pmm-service.monitoring.svc.cluster.local

  backup:
    enabled: true
    image: percona/percona-backup-mongodb:2.4.1
    storages:
      s3-ap-south-1:
        type: s3
        s3:
          bucket: mongodb-backups-2
          region: ap-south-1
          credentialsSecret: s3-secret

    tasks:
      - name: daily-backup
        enabled: true
        # schedule: "*/1 * * * *"
        schedule: "30 20 * * *"
        keep: 7
        storageName: s3-ap-south-1
      
  replsets:
    - name: rs0
      size: 2

      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname

      resources:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

      volumeSpec:
        persistentVolumeClaim:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

      expose:
        enabled: true

  sharding:
    enabled: false