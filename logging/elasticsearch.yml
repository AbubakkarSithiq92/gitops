apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: app-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
        env:
        - name: discovery.type
          value: single-node

        # Security ENABLED (default in 8.x, but explicit)
        - name: xpack.security.enabled
          value: "true"

        # HTTP TLS disabled (simpler inside cluster)
        - name: xpack.security.http.ssl.enabled
          value: "false"

        # Set elastic superuser password
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: password
        ports:
        - containerPort: 9200


---

apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: app-stack
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 9200
