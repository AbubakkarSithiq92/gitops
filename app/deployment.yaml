apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app-stack
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo
        args:
        - "-text=Hello from Kubernetes Observability Stack"
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /dead
            port: 5678
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /
            port: 5678
          failureThreshold: 30
          periodSeconds: 5
